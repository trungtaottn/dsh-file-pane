# dsh-file-pane — semantic-release pipeline (GitHub-only, NO npm publish).
#
# Release model (see release.config.mjs):
#   - push to main → stable channel (latest): tag v0.x.y + GitHub Release
#   - push to dev   → pre-release channel (beta): tag v0.x.y-beta.N
#
# npm publishing is disabled (npmPublish: false in release.config.mjs), so no
# NPM_TOKEN / OIDC is needed: @semantic-release/npm only bumps package.json and
# creates the git tag, and @semantic-release/github publishes the GitHub
# Release. The packed tarball is attached so the plugin can be installed
# straight from the release:
#
#   dsh plugin --profile web add <release tarball URL>
#   sudo systemctl restart deepseek-harness-web

name: Release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  issues: write # semantic-release/github files issues when a release fails

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history for version analysis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build client bundle + PDF.js assets
        run: npm run build
      - name: Semantic release (GitHub only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release