# dsh-file-pane — semantic-release pipeline.
#
# Release model (see release.config.mjs):
#   - push to main → stable channel (latest): 0.x.y
#   - push to dev   → pre-release channel (beta): 0.x.y-beta.N
#
# npm publish auth — TWO supported paths (either one is enough):
#   1. Trusted Publishing via OIDC (no token needed, RECOMMENDED):
#      - Configure once on npmjs.com: account → "Access Tokens" → "Integrations"
#        (or "Trusted Publishers") → add GitHub Actions for this repo.
#      - The job below carries `id-token: write`, which semantic-release detects
#        (oidcContextEstablished) and publishes with provenance automatically.
#   2. NPM_TOKEN repo secret (Settings → Secrets and variables → Actions):
#      - classic fallback; used when OIDC is not configured.
# GITHUB_TOKEN is provided automatically by Actions.

name: Release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  issues: write # semantic-release/github files issues when a release fails
  id-token: write # OIDC trusted publishing + npm provenance

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history for version analysis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Build client bundle + PDF.js assets
        run: npm run build
      - name: Semantic release (OIDC trusted publishing or NPM_TOKEN)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release